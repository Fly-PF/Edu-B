      provider: ${SAFETY_SEMANTIC_PROVIDER:mock}
      api-key: ${DASHSCOPE_API_KEY:}
      endpoint: ${DASHSCOPE_ENDPOINT:https://ws-2oz82zxkm7hqgi00.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions}
      model: ${DASHSCOPE_MODEL:qwen3.7-plus}
      timeout-seconds: ${DASHSCOPE_TIMEOUT_SECONDS:20}
      enable-thinking: ${DASHSCOPE_ENABLE_THINKING:false}
    rules:
      # 第三部分：规则词库。这里用于学校/平台自定义扩展；Java 内部仍保留一套基础兜底词库。
