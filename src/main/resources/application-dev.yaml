edu:
  course-storage:
    local-path: ${COURSE_STORAGE_LOCAL_PATH:uploads}
    public-base-url: ${COURSE_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${EDU_MYSQL_HOST:127.0.0.1}
    port: ${EDU_MYSQL_PORT:3306}
    database: ${EDU_MYSQL_DATABASE:edu}
    username: ${EDU_MYSQL_USERNAME:root}
    password: ${EDU_MYSQL_PASSWORD:root}
  redis:
    host: ${EDU_REDIS_HOST:127.0.0.1}
    port: ${EDU_REDIS_PORT:6379}
    password: ${EDU_REDIS_PASSWORD:root}
    database: ${EDU_REDIS_DATABASE:6}
  minio:
    endpoint: ${EDU_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access_key: ${EDU_MINIO_ACCESS_KEY:root}
    secret_key: ${EDU_MINIO_SECRET_KEY:rootroot}
    bucker_name: ${EDU_MINIO_BUCKET:edu}
    public_base_url: ${EDU_MINIO_PUBLIC_BASE_URL:http://localhost:8080}
    avatar:
      avatar_files_base_url: avatar/files/
      default_avatar: avatar/default_avatar.png
    rag:
      rag_files_base_url: rag/files/
      max_rag_file_size: 100MB
      max_ref_rag_kb_count: 10
      max_ref_rag_doc_count: 100
  milvus:
    endpoint: ${EDU_MILVUS_ENDPOINT:http://127.0.0.1:19530}
    token: ${EDU_MILVUS_TOKEN:rootroot}
    database_name: ${EDU_MILVUS_DATABASE_NAME:Edu}
    rag:
      top_k: 8
      score_threshold: 0.6
      collection_name: rag_chunk
      vector:
        dimension: 2048
        metric_type: COSINE
  ai-model:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat-model:
        max-history-message-count: 20
        model-type: multimodel
        model-name: qwen3.5-omni-flash
      text-model:
        max-history-message-count: 20
        model-type: textmodel
        model-name: qwen3.7-plus
      multi-model:
        max-history-message-count: 20
        model-type: multimodel
        model-name: qwen3.5-omni-flash
      embedding-model:
        max-history-message-count: 20
        model-type: textembedmodel
        model-name: qwen3.7-text-embedding

  # jwt、mail 不用改动，本地自测完全通用
  jwt:
    secret-key: abcdefghijklmnopqabcdefghijklmnopq
    expire-time: 72000000000
    jwt-name: Authorization
  mail:
    from-name: Edu-B
    captcha:
      length: 6
      expire-minutes: 5
  ai:
    companion:
      api-url: ${AI_COMPANION_API_URL:http://localhost:11434/v1/chat/completions}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-5.6-luna}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:20}
    face:
      tencent:
        secret-id: ${TENCENT_FACE_SECRET_ID:}
        secret-key: ${TENCENT_FACE_SECRET_KEY:}
        region: ${TENCENT_FACE_REGION:ap-guangzhou}
        endpoint: ${TENCENT_FACE_ENDPOINT:iai.tencentcloudapi.com}
        version: ${TENCENT_FACE_VERSION:2020-03-03}
        compare-threshold: ${TENCENT_FACE_COMPARE_THRESHOLD:80}
        timeout-seconds: ${TENCENT_FACE_TIMEOUT_SECONDS:20}
