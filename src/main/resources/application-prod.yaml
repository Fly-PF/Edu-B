  ai-model:
    rag:
      chat-model:
        supplier: openai
        base-url: https://llm-0ztuci5it54ptrlp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${OPENAI_API_KEY}
        model-type: multimodel
        model-name: qwen3.5-omni-flash
      text-model:
        supplier: openai
        base-url: https://llm-0ztuci5it54ptrlp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${OPENAI_API_KEY}
        model-type: textmodel
        model-name: qwen3.7-plus
      multi-model:
        supplier: openai
        base-url: https://llm-0ztuci5it54ptrlp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${OPENAI_API_KEY}
        model-type: multimodel
        model-name: qwen3.5-omni-flash
      embedding-model:
        supplier: openai
        base-url: https://llm-0ztuci5it54ptrlp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${OPENAI_API_KEY}
        model-type: textembedmodel
        model-name: qwen3.7-text-embedding

    teacher-ai:
      chat-model:
        supplier: compatible
        base-url: https://ws-ax2a1h6argluh7eh.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
        api-key: ${OPENAI_API_KEY}
        model-type: textmodel
        model-name: qwen3.7-plus
        timeout: 90000
        max-tokens: 560
    companion:
      enabled: true
      chat-model:
        supplier: compatible
        base-url: https://ws-ax2a1h6argluh7eh.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
        api-key: ${OPENAI_API_KEY}
        api-key-required: true
        model-type: textmodel
        model-name: qwen3.7-plus
        timeout: 90000
        max-tokens: 560
      web-search:
        enabled: true
        url: https://www.bing.com/search
        timeout: 8000
    learning-analysis:
      chat-model:
        supplier: openai
        base-url: https://llm-0ztuci5it54ptrlp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
        api-key: ${LEARNING_AI_API_KEY}
        model-type: textmodel
        model-name: gpt-4.1-mini
    safety-semantic:
      chat-model:
        supplier: dashscope
        base-url: https://llm-0ztuci5it54ptrlp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
        api-key: ${DASHSCOPE_API_KEY}
        model-type: textmodel
        model-name: qwen3.7-plus
        timeout: 20000
    draw-guess:
      multi-model:
        supplier: openai
        base-url: https://api.openai.com/v1/responses
        api-key: ${DRAW_GUESS_API_KEY}
        model-type: multimodel
        model-name: gpt-5.6-luna
        timeout: 20000
    face:
      tencent:
        secret-id: ${TENCENT_FACE_SECRET_ID}
        secret-key: ${TENCENT_FACE_SECRET_KEY}
        region: ${TENCENT_FACE_REGION:ap-guangzhou}
        endpoint: ${TENCENT_FACE_ENDPOINT:iai.tencentcloudapi.com}
        version: ${TENCENT_FACE_VERSION:2020-03-03}
        compare-threshold: ${TENCENT_FACE_COMPARE_THRESHOLD:80}
        timeout-seconds: ${TENCENT_FACE_TIMEOUT_SECONDS:20}
