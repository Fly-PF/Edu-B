custom:
  course-storage:
    public-base-url: http://134.175.57.75:80
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: mysql
    port: 3306
    database: edu
    username: root
    password: root
  redis:
    host: redis
    port: 6379
    password: root
    database: 6
  minio:
    endpoint: http://minio:9000
    access_key: root
    secret_key: rootroot
    public_base_url: http://134.175.57.75:80
  milvus:
    endpoint: http://standalone:19530
    token: rootroot
  ai-model:
    rag:
      chat-model:
        supplier: openai
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: multimodel
        model-name: gemini-3.7-flash
      text-model:
        supplier: openai
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: textmodel
        model-name: qwen3.6-plus
      multi-model:
        supplier: openai
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: multimodel
        model-name: gemini-3.7-flash
      embedding-model:
        supplier: openai
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: textembedmodel
        model-name: Qwen3-Embedding-8B

    problem-solving:
      chat-model:
        supplier: ${custom.ai-model.rag.chat-model.supplier}
        base-url: ${custom.ai-model.rag.chat-model.base-url}
        api-key: ${custom.ai-model.rag.chat-model.api-key}
        model-type: ${custom.ai-model.rag.chat-model.model-type}
        model-name: ${custom.ai-model.rag.chat-model.model-name}

    teacher-ai:
      chat-model:
        supplier: compatible
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: textmodel
        model-name: qwen3.6-plus
        timeout: 90000
        max-tokens: 560
    companion:
      enabled: true
      chat-model:
        supplier: compatible
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        api-key-required: false
        model-type: textmodel
        model-name: qwen3.6-plus
        timeout: 90000
        max-tokens: 560
      web-search:
        enabled: true
        url: https://www.bing.com/search
        timeout: 8000
    learning-analysis:
      chat-model:
        supplier: openai
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: textmodel
        model-name: qwen3.6-plus
    safety-semantic:
      chat-model:
        supplier: dashscope
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: textmodel
        model-name: qwen3.6-plus
        timeout: 20000
    draw-guess:
      multi-model:
        supplier: openai
        base-url: ${OPENAI_BASE_URL}
        api-key: ${OPENAI_API_KEY}
        model-type: multimodel
        model-name: gemini-3.7-flash
        timeout: 20000
    face:
      tencent:
        secret-id: ${TENCENT_FACE_SECRET_ID}
        secret-key: ${TENCENT_FACE_SECRET_KEY}
        region: ap-guangzhou
        endpoint: iai.tencentcloudapi.com
        version: 2020-03-03
        compare-threshold: 80
        timeout-seconds: 20
