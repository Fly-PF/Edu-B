server:
  port: 8080
spring:
  application:
    name: Edu-B
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${edu.datasource.driver-class-name}
    username: ${edu.datasource.username}
    password: ${edu.datasource.password}
    url: jdbc:mysql://${edu.datasource.host}:${edu.datasource.port}/${edu.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      host: ${edu.redis.host}
      port: ${edu.redis.port}
      password: ${edu.redis.password}
      database: ${edu.redis.database}
      connect-timeout: 10s
  mail:
    host: smtp.qq.com
    port: 465
    username: your@qq.com
    password: your-auth-code
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
logging:
  level:
    org.springframework.security: DEBUG
edu:
  ai:
    companion:
      enabled: ${AI_COMPANION_ENABLED:true}
      api-url: ${AI_COMPANION_API_URL:http://localhost:11434/v1/chat/completions}
      api-key: ${AI_COMPANION_API_KEY:}
      model: ${AI_COMPANION_MODEL:qwen2.5:3b}
      timeout-seconds: ${AI_COMPANION_TIMEOUT_SECONDS:90}
      max-tokens: ${AI_COMPANION_MAX_TOKENS:560}
