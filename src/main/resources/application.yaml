server:
  port: 8080
spring:
  application:
    name: Edu-B
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${edu.datasource.driver-class-name}
    username: ${edu.datasource.username}
    password: ${edu.datasource.password}
    url: jdbc:mysql://${edu.datasource.host}:${edu.datasource.port}/${edu.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      host: ${edu.redis.host}
      port: ${edu.redis.port}
      password: ${edu.redis.password}
      database: ${edu.redis.database}
      connect-timeout: 10s
  mail:
    host: smtp.qq.com
    port: 465
    username: your@qq.com
    password: your-auth-code
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
logging:
  level:
    org.springframework.security: DEBUG
edu:
  learning-ai:
    # OpenAI-compatible chat/completions URL. Keep credentials in environment variables, never commit them.
    base-url: ${LEARNING_AI_BASE_URL:}
    api-key: ${LEARNING_AI_API_KEY:}
    model: ${LEARNING_AI_MODEL:gpt-4.1-mini}
    # Some OpenAI-compatible providers reject response_format. The gateway retries once without it.
    json-mode: ${LEARNING_AI_JSON_MODE:true}
