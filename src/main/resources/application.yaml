server:
  port: 8080
spring:
  application:
    name: Edu-B
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  sql:
    init:
      mode: always
      schema-locations: classpath:db/learning-practice.sql,classpath:db/course-knowledge-base.sql,classpath:db/course-study-progress.sql,classpath:db/safety-record.sql
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${custom.datasource.driver-class-name}
    username: ${custom.datasource.username}
    password: ${custom.datasource.password}
    url: jdbc:mysql://${custom.datasource.host}:${custom.datasource.port}/${custom.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      host: ${custom.redis.host}
      port: ${custom.redis.port}
      password: ${custom.redis.password}
      database: ${custom.redis.database}
      connect-timeout: 10s
logging:
  level:
    org.springframework.security: DEBUG

edu:
  mail:
    host: smtp.qq.com
    port: 465
    username: your@qq.com
    password: your-auth-code
    from-name: Edu-B
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
    captcha:
      length: 6
      expire-minutes: 5

  jwt:
    secret-key: abcdefghijklmnopqabcdefghijklmnopq
    expire-time: 72000000000
    jwt-name: Authorization

  course-storage:
    local-path: uploads
    public-base-url: ${custom.course-storage.public-base-url}
  minio:
    public_base_url: ${custom.minio.public_base_url}
    endpoint: ${custom.minio.endpoint}
    access_key: ${custom.minio.access_key}
    secret_key: ${custom.minio.secret_key}
    bucker_name: edu
    avatar:
      avatar_files_base_url: avatar/files/
      default_avatar: avatar/default_avatar.png
    rag:
      rag_files_base_url: rag/files/
      max_rag_file_size: 100MB
      max_ref_rag_kb_count: 10
      max_ref_rag_doc_count: 100
    gov:
      gov_files_base_url: gov/files/
      max_gov_file_size: 100MB
  milvus:
    endpoint: ${custom.milvus.endpoint}
    token: ${custom.milvus.token}
    database_name: Edu
    rag:
      top_k: 8
      score_threshold: 0.6
      collection_name: rag_chunk
      vector:
        dimension: 2048
        metric_type: COSINE
  ai-model:
    rag:
      chat-model:
        max-history-message-count: 20
        supplier: ${custom.ai-model.rag.chat-model.supplier}
        base-url: ${custom.ai-model.rag.chat-model.base-url}
        api-key: ${custom.ai-model.rag.chat-model.api-key}
        model-type: ${custom.ai-model.rag.chat-model.model-type}
        model-name: ${custom.ai-model.rag.chat-model.model-name}
      text-model:
        max-history-message-count: 20
        supplier: ${custom.ai-model.rag.text-model.supplier}
        base-url: ${custom.ai-model.rag.text-model.base-url}
        api-key: ${custom.ai-model.rag.text-model.api-key}
        model-type: ${custom.ai-model.rag.text-model.model-type}
        model-name: ${custom.ai-model.rag.text-model.model-name}
      multi-model:
        max-history-message-count: 20
        supplier: ${custom.ai-model.rag.multi-model.supplier}
        base-url: ${custom.ai-model.rag.multi-model.base-url}
        api-key: ${custom.ai-model.rag.multi-model.api-key}
        model-type: ${custom.ai-model.rag.multi-model.model-type}
        model-name: ${custom.ai-model.rag.multi-model.model-name}
      embedding-model:
        max-history-message-count: 20
        supplier: ${custom.ai-model.rag.embedding-model.supplier}
        base-url: ${custom.ai-model.rag.embedding-model.base-url}
        api-key: ${custom.ai-model.rag.embedding-model.api-key}
        model-type: ${custom.ai-model.rag.embedding-model.model-type}
        model-name: ${custom.ai-model.rag.embedding-model.model-name}
    teacher-ai:
      chat-model:
        supplier: ${custom.ai-model.teacher-ai.chat-model.supplier}
        base-url: ${custom.ai-model.teacher-ai.chat-model.base-url}
        api-key: ${custom.ai-model.teacher-ai.chat-model.api-key}
        model-type: ${custom.ai-model.teacher-ai.chat-model.model-type}
        model-name: ${custom.ai-model.teacher-ai.chat-model.model-name}
        timeout: ${custom.ai-model.teacher-ai.chat-model.timeout}
        max-tokens: ${custom.ai-model.teacher-ai.chat-model.max-tokens}
    companion:
      enabled: ${custom.ai-model.companion.enabled}
      chat-model:
        supplier: ${custom.ai-model.companion.chat-model.supplier}
        base-url: ${custom.ai-model.companion.chat-model.base-url}
        api-key: ${custom.ai-model.companion.chat-model.api-key}
        api-key-required: ${custom.ai-model.companion.chat-model.api-key-required}
        model-type: ${custom.ai-model.companion.chat-model.model-type}
        model-name: ${custom.ai-model.companion.chat-model.model-name}
        timeout: ${custom.ai-model.companion.chat-model.timeout}
        max-tokens: ${custom.ai-model.companion.chat-model.max-tokens}
      web-search:
        enabled: ${custom.ai-model.companion.web-search.enabled}
        url: ${custom.ai-model.companion.web-search.url}
        timeout: ${custom.ai-model.companion.web-search.timeout}
    learning-analysis:
      chat-model:
        supplier: ${custom.ai-model.learning-analysis.chat-model.supplier}
        base-url: ${custom.ai-model.learning-analysis.chat-model.base-url}
        api-key: ${custom.ai-model.learning-analysis.chat-model.api-key}
        model-type: ${custom.ai-model.learning-analysis.chat-model.model-type}
        model-name: ${custom.ai-model.learning-analysis.chat-model.model-name}
    safety-semantic:
      chat-model:
        supplier: ${custom.ai-model.safety-semantic.chat-model.supplier}
        base-url: ${custom.ai-model.safety-semantic.chat-model.base-url}
        api-key: ${custom.ai-model.safety-semantic.chat-model.api-key}
        model-type: ${custom.ai-model.safety-semantic.chat-model.model-type}
        model-name: ${custom.ai-model.safety-semantic.chat-model.model-name}
        timeout: ${custom.ai-model.safety-semantic.chat-model.timeout}
    draw-guess:
      multi-model:
        supplier: ${custom.ai-model.draw-guess.multi-model.supplier}
        base-url: ${custom.ai-model.draw-guess.multi-model.base-url}
        api-key: ${custom.ai-model.draw-guess.multi-model.api-key}
        model-type: ${custom.ai-model.draw-guess.multi-model.model-type}
        model-name: ${custom.ai-model.draw-guess.multi-model.model-name}
        timeout: ${custom.ai-model.draw-guess.multi-model.timeout}
    face:
      tencent:
        secret-id: ${custom.ai-model.face.tencent.secret-id}
        secret-key: ${custom.ai-model.face.tencent.secret-key}
        region: ${custom.ai-model.face.tencent.region}
        endpoint: ${custom.ai-model.face.tencent.endpoint}
        version: ${custom.ai-model.face.tencent.version}
        compare-threshold: ${custom.ai-model.face.tencent.compare-threshold}
        timeout-seconds: ${custom.ai-model.face.tencent.timeout-seconds}
