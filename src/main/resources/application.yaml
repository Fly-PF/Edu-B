server:
  port: 8080
spring:
  application:
    name: Edu-B
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  sql:
    init:
      mode: always
      schema-locations: classpath:db/learning-practice.sql,classpath:db/course-knowledge-base.sql,classpath:db/course-study-progress.sql,classpath:db/safety-record.sql
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${edu.datasource.driver-class-name}
    username: ${edu.datasource.username}
    password: ${edu.datasource.password}
    url: jdbc:mysql://${edu.datasource.host}:${edu.datasource.port}/${edu.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      host: ${edu.redis.host}
      port: ${edu.redis.port}
      password: ${edu.redis.password}
      database: ${edu.redis.database}
      connect-timeout: 10s
  mail:
    host: smtp.qq.com
    port: 465
    username: your@qq.com
    password: your-auth-code
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
logging:
  level:
    org.springframework.security: DEBUG
edu:
  ai:
    provider: ${TEACHER_AI_PROVIDER:compatible}
    grading-model: ${TEACHER_AI_MODEL:${AI_COMPANION_MODEL:qwen2.5:3b}}
    companion:
      enabled: ${AI_COMPANION_ENABLED:true}
      api-url: ${AI_COMPANION_API_URL:}
      api-key: ${AI_COMPANION_API_KEY:}
      api-key-required: ${AI_COMPANION_API_KEY_REQUIRED:false}
      model: ${AI_COMPANION_MODEL:qwen2.5:3b}
      timeout-seconds: ${AI_COMPANION_TIMEOUT_SECONDS:90}
      max-tokens: ${AI_COMPANION_MAX_TOKENS:560}
      web-search-enabled: ${AI_COMPANION_WEB_SEARCH_ENABLED:true}
      web-search-url: ${AI_COMPANION_WEB_SEARCH_URL:https://www.bing.com/search}
      web-search-timeout-seconds: ${AI_COMPANION_WEB_SEARCH_TIMEOUT_SECONDS:8}
  learning-ai:
    # OpenAI-compatible chat/completions URL. Keep credentials in environment variables, never commit them.
    base-url: ${LEARNING_AI_BASE_URL:}
    api-key: ${LEARNING_AI_API_KEY:}
    model: ${LEARNING_AI_MODEL:gpt-4.1-mini}
    # Some OpenAI-compatible providers reject response_format. The gateway retries once without it.
    json-mode: ${LEARNING_AI_JSON_MODE:true}
